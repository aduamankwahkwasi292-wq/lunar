<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      background: radial-gradient(120% 120% at 50% 0%, #161617 0%, #000 70%);
      color: #f1f1f2; font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; user-select: none; -webkit-user-select: none;
      border: 1px solid rgba(255, 255, 255, 0.14); box-sizing: border-box;
    }
    .logo { width: 66px; height: 54px; filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.45)); animation: float 2.4s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    .brand { font-weight: 600; font-size: 26px; letter-spacing: 0.04em; color: #fff; }
    .brand span { color: #b9bcc1; font-weight: 300; }
    .sub { font-size: 12px; color: #8e9095; letter-spacing: 0.04em; }
    .bar { width: 180px; height: 3px; border-radius: 99px; background: rgba(255,255,255,0.08); overflow: hidden; }
    .bar i { display: block; height: 100%; width: 40%; border-radius: 99px;
      background: linear-gradient(90deg, transparent, #fff, transparent);
      animation: slide 1.3s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
  </style>
</head>
<body>
  <svg class="logo" viewBox="0 0 44 36" aria-hidden="true">
    <defs><linearGradient id="m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="0.55" stop-color="#bfc2c6"/><stop offset="1" stop-color="#7c8086"/></linearGradient></defs>
    <path d="M4 32V6l14 14L32 6v26" fill="none" stroke="url(#m)" stroke-width="5"/>
    <circle cx="39" cy="29.5" r="3" fill="#fff"/>
  </svg>
  <div class="brand">MrSOLIS <span>3</span></div>
  <div class="bar"><i></i></div>
  <div class="sub">Starting your private classroom…</div>
</body>
</html>
